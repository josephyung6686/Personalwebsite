<html lang="en">
<head><script>try{if(localStorage.getItem('tuckThemeSeed')!=='light'){localStorage.setItem('tuckTheme','light');localStorage.setItem('tuckThemeSeed','light')}}catch(e){}</script><script>/* one Light/Dark choice for every page: remembered and applied when you move between Finder, Tuck and Brain */(function(){var k="tuckTheme",d=document.documentElement,t=null,ready=false;try{t=localStorage.getItem(k)}catch(e){}if(t)d.dataset.theme=t;new MutationObserver(function(){if(!ready)return;var v=d.dataset.theme;try{v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch(e){}}).observe(d,{attributes:true,attributeFilter:["data-theme"]});function apply(){if(t&&d.dataset.theme!==t){if(typeof window.setTheme==="function"){try{window.setTheme(t)}catch(e){d.dataset.theme=t}}else d.dataset.theme=t}ready=true}if(document.readyState==="complete")apply();else addEventListener("load",apply)})();</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tuck Finder</title>
<link rel="stylesheet" href="system.css"><link rel="stylesheet" href="phosphor.css">

<script src="sample.js"></script>

<style>
/* ---------- page-only tokens (new names, no system token is redefined) */
:root{--tag-red:#ff4f45;--tag-orange:#ff9f0a;--tag-yellow:#f5c400;--tag-green:#30c552;--tag-blue:#2f7bff;--tag-purple:#b25ce0;--tag-gray:#9a9aa1;
  --sb-sel:color-mix(in oklab,var(--ink) 9%,transparent);--row:24px}

.theme{position:fixed;top:9px;right:32px;z-index:5}
.theme button{height:24px;font-size:12px}
.win{inset:46px 32px 24px;--side-w:224px;grid-template-rows:minmax(0,1fr)}
.win:has(.side.hide){--side-w:0px}

/* ---------- sidebar (Tahoe: inset floating panel) */
.side{padding:8px 0 8px 8px;min-width:0;min-height:0}
.sb{height:100%;border-radius:11px;background:color-mix(in oklab,var(--side) 93%,transparent);backdrop-filter:blur(18px);box-shadow:0 0 0 .5px var(--line2);overflow:auto;display:flex;flex-direction:column}
.sb .lights{padding:13px 13px 8px}
.sb nav{padding:0 0 12px}
.sh{display:flex;align-items:center;gap:5px;padding:12px 16px 3px;font:600 11px/1.2 var(--f);color:var(--ink3)}
.sh img{width:13px;height:13px}
.sbi{display:flex;align-items:center;gap:8px;width:calc(100% - 12px);margin:0 6px;height:28px;padding:0 10px;border-radius:7px;font:400 13px/1 var(--f);color:var(--ink);text-align:left}
.sbi .ph,.sbi .ph-fill{font-size:16px;color:var(--ac);width:17px;text-align:center}
.sbi:hover{background:var(--hov)}
.sbi.on{background:var(--sb-sel)}
.sbi .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbi .count{font-size:10.5px}
.sbi.drop{background:var(--ac);color:#fff}.sbi.drop .ph,.sbi.drop .ph-fill,.sbi.drop .count{color:#fff}
.tdot{width:10px;height:10px;border-radius:50%;flex:none;margin:0 3px;background:var(--c)}
.sec-in{animation:secIn .2s var(--ease)}
@keyframes secIn{from{opacity:0;transform:translateY(-4px)}}

/* ---------- main column */
.main{position:relative;display:grid;grid-template-rows:52px minmax(0,1fr) auto;min-width:0;background:var(--win)}
.tb{display:flex;align-items:center;gap:8px;padding:0 12px 0 10px;border-bottom:1px solid var(--line);min-width:0}
.tg{display:flex;align-items:center;gap:1px;padding:2px;border-radius:999px;background:var(--win);box-shadow:0 0 0 .5px var(--line2),0 1px 3px rgba(20,30,60,.07)}
.tg .ib{width:32px;height:28px;border-radius:999px;font-size:17px}
.tg .ib.w{width:auto;padding:0 8px;gap:2px;display:inline-flex}
.tg .ib.w .ph-caret-down{font-size:10px}
.ib[disabled]{opacity:.35;pointer-events:none}
.tb h1{font:700 15px/1 var(--f);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:60px;margin-left:4px}
.tb .sp{flex:1}
.tb .seg button{min-width:34px;padding:0 8px}
.tsw{gap:7px;padding:0 8px 0 7px;font-weight:600}
.tsw img{width:16px;height:16px}
.tsw.on{color:var(--ac-ink)}
.tb .search{min-width:170px;width:190px;height:30px;border-radius:999px}

/* ---------- content body */
.body{position:relative;overflow:auto;outline:0;min-height:0}
.body:focus-visible{outline:0}html.kb .body:focus-visible{box-shadow:inset 0 0 0 2px var(--ac)}
.swap{animation:swap .2s var(--ease)}
@keyframes swap{from{opacity:0;transform:translateX(10px)}}

/* file icons drawn with CSS (one recipe for every view and size) */
.fi{position:relative;display:inline-block;width:var(--s);height:var(--s);flex:none;vertical-align:middle}
.fo::before{content:"";position:absolute;left:5%;top:13%;width:40%;height:22%;border-radius:calc(var(--s)*.08) calc(var(--s)*.08) 0 0;background:color-mix(in oklab,var(--k-folder) 76%,#183c9e)}
.fo::after{content:"";position:absolute;left:3%;right:3%;top:21%;bottom:12%;border-radius:calc(var(--s)*.07);background:color-mix(in oklab,var(--k-folder) 80%,#183c9e)}
.fo>i{position:absolute;z-index:1;left:3%;right:3%;top:31%;bottom:12%;border-radius:calc(var(--s)*.07);background:color-mix(in oklab,var(--k-folder) 78%,#fff);display:grid;place-items:center;font-size:calc(var(--s)*.3);color:color-mix(in oklab,var(--k-folder) 55%,#0b2777);font-style:normal}
.dc .pg{position:absolute;left:16%;right:16%;top:4%;bottom:4%;background:#fff;border:max(1px,calc(var(--s)*.008)) solid rgba(20,30,60,.16);border-radius:calc(var(--s)*.035);clip-path:polygon(0 0,calc(100% - var(--s)*.17) 0,100% calc(var(--s)*.17),100% 100%,0 100%);overflow:hidden}
.dc .pg::after{content:"";position:absolute;right:-1px;top:-1px;width:calc(var(--s)*.17);height:calc(var(--s)*.17);background:linear-gradient(to top right,#d8dde8 50%,transparent 50%)}
.dc .pg b{position:absolute;left:0;right:0;bottom:9%;height:15%;background:var(--kc);color:#fff;font:700 calc(var(--s)*.1)/1 var(--f);letter-spacing:.03em;display:grid;place-items:center}
.dc.big .pg b{height:11%;font-size:calc(var(--s)*.07)}
.dc.big .pg::before{content:"";position:absolute;left:12%;right:14%;top:13%;height:56%;background:linear-gradient(#8f96a8,#8f96a8) 0 0/58% 6% no-repeat,repeating-linear-gradient(to bottom,#d3d8e2 0 max(1px,calc(var(--s)*.016)),transparent 0 calc(var(--s)*.055)) 0 18%/100% 82% no-repeat}
.dc.big.h .pg::before{top:24%;height:48%;background:repeating-linear-gradient(to bottom,#d3d8e2 0 max(1px,calc(var(--s)*.016)),transparent 0 calc(var(--s)*.055)) 0 18%/100% 82% no-repeat}
.dc .pg em{position:absolute;left:12%;right:14%;top:10%;font:700 calc(var(--s)*.036)/1.25 var(--f);font-style:normal;color:#2a2f3d}
.dc.xls.big .pg::before{background:linear-gradient(90deg,transparent 0 32%,#d3d8e2 32% 33%,transparent 33% 65%,#d3d8e2 65% 66%,transparent 66%),repeating-linear-gradient(to bottom,#d3d8e2 0 max(1px,calc(var(--s)*.008)),transparent 0 calc(var(--s)*.05));top:9%}
.im .p,.ss .p{position:absolute;left:4%;right:4%;top:17%;bottom:17%;border-radius:calc(var(--s)*.03);border:max(1px,calc(var(--s)*.025)) solid #fff;box-shadow:0 0 0 .5px rgba(0,0,0,.22),0 1px 3px rgba(0,0,0,.14)}
.im .p{background:radial-gradient(circle at 74% 30%,hsl(var(--h) 90% 92%) 0 7%,transparent 8%),linear-gradient(168deg,transparent 54%,hsl(calc(var(--h) + 110) 30% 36%) 55%),linear-gradient(200deg,transparent 62%,hsl(calc(var(--h) + 90) 28% 46%) 63%),linear-gradient(hsl(var(--h) 62% 66%),hsl(calc(var(--h) + 25) 66% 84%))}
.ss .p{background:linear-gradient(#cfd6e5,#cfd6e5) 0 0/100% 13% no-repeat,linear-gradient(#e7ebf3,#e7ebf3) 0 13%/26% 87% no-repeat,linear-gradient(#b9c6e6,#b9c6e6) 34% 30%/56% 10% no-repeat,linear-gradient(#dde2ec,#dde2ec) 34% 52%/56% 6% no-repeat,linear-gradient(#dde2ec,#dde2ec) 34% 66%/40% 6% no-repeat,#fff}
.dm .p{position:absolute;left:9%;right:9%;top:19%;bottom:19%;border-radius:calc(var(--s)*.1);background:#eceef3;box-shadow:inset 0 0 0 max(1px,calc(var(--s)*.012)) rgba(20,30,60,.14),0 1px 2px rgba(0,0,0,.12);display:grid;place-items:center;color:#5d6375;font-size:calc(var(--s)*.34)}
.ap .p{position:absolute;inset:8%;border-radius:23%;background:var(--c);display:grid;place-items:center;color:#fff;font-size:calc(var(--s)*.5);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.15)}
.ap .p img{width:72%;height:72%}
.ap.tk .p{background:#fff}
.fi>.lk{position:absolute;left:2%;bottom:6%;width:clamp(14px,calc(var(--s)*.32),44px);height:clamp(14px,calc(var(--s)*.32),44px);border-radius:50%;background:var(--lock);color:#fff;display:grid;place-items:center;font-size:clamp(9px,calc(var(--s)*.18),24px);box-shadow:0 0 0 2px var(--win);z-index:2}

/* list view */
.lst{--cols:minmax(240px,1fr) 190px 84px 190px;padding-bottom:84px;min-width:720px}
.lst.srt{--cols:minmax(220px,1fr) 170px 180px 76px 150px}
.lh{position:sticky;top:0;z-index:var(--z-sticky);display:grid;grid-template-columns:var(--cols);height:28px;align-items:center;padding:0 20px;background:var(--win);border-bottom:1px solid var(--line);font:500 12px/1 var(--f);color:var(--ink3)}
.lh button{display:flex;align-items:center;gap:4px;height:100%;padding:0 8px;text-align:left;color:inherit;border-left:1px solid var(--line)}
.lh button:first-child{border-left:0;padding-left:22px}
.lh button.on{color:var(--ink);font-weight:600}
.lh button.r{justify-content:flex-end}
.lh .ph{font-size:10px}
.rows{padding:4px 0}
.row{display:grid;grid-template-columns:var(--cols);align-items:center;height:var(--row);margin:0 8px;padding:0 12px;border-radius:6px;font:400 13px/1 var(--f);color:var(--ink)}
.rows .row:nth-child(even){background:var(--stripe)}
.row .c{padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink3);font-size:12.5px}
.row .c.r{text-align:right}
.row .c.n{display:flex;align-items:center;gap:6px;padding-left:calc(var(--d,0)*18px);color:var(--ink);font-size:13px;overflow:hidden}
.row .ri{display:flex;align-items:center;gap:5px;min-width:0}.row .ri>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .ri .ph{font-size:13px}
.tw{width:14px;height:14px;display:grid;place-items:center;flex:none;color:var(--ink3);font-size:10px;border-radius:3px}
.tw .ph-fill{transition:transform .15s var(--ease)}
.tw.open .ph-fill{transform:rotate(90deg)}
.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dots{display:inline-flex;gap:2px;flex:none}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 0 1px var(--win)}
.nd{width:7px;height:7px;border-radius:50%;background:var(--ac);flex:none}
.lkI{color:var(--lock);font-size:12px;flex:none}
.row.gh{background:none!important;font:600 12px var(--f);color:var(--ink2);border-bottom:1px solid var(--line);border-radius:0;margin-top:6px}
.rows.grp .row:nth-child(even){background:none}
/* selection: accent when the list has focus, grey when it does not */
.body .sel{background:var(--soft2)!important}
.body:focus-within .row.sel,.body:focus-within .ci.sel{background:var(--ac)!important;color:#fff}
.body:focus-within .row.sel .c,.body:focus-within .row.sel .tw,.body:focus-within .ci.sel .ph-caret-right,.body:focus-within .ci.sel .lkI{color:rgba(255,255,255,.9)}
.body:focus-within .sel .nd{background:#fff}.body:focus-within .sel .dots i{box-shadow:0 0 0 1.5px #fff}
.dropT{box-shadow:inset 0 0 0 2px var(--ac)!important;background:var(--ac-fill)!important}

/* icon view */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:14px 6px;padding:18px 18px 90px;align-content:start}
.gi{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;border-radius:8px}
.gi .ibx{width:78px;height:78px;border-radius:9px;display:grid;place-items:center}
.gi .nm2{display:flex;align-items:center;gap:4px;max-width:100%;padding:2px 6px;border-radius:5px;font:400 12px/1.25 var(--f);text-align:center;color:var(--ink)}
.gi .nm2 span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.gi .sub{font:400 11px/1 var(--f);color:var(--ink3);margin-top:-2px}
.gi.sel{background:none!important}
.gi.sel .ibx{background:var(--soft2)}
.gi.sel .nm2{background:var(--soft2)}
.body:focus-within .gi.sel .nm2{background:var(--ac);color:#fff}
.body:focus-within .gi.sel .nd{background:#fff}
.gi.dropT{box-shadow:none!important;background:none!important}.gi.dropT .ibx{box-shadow:inset 0 0 0 2px var(--ac);background:var(--ac-fill)}
.ghd{grid-column:1/-1;font:600 12px var(--f);color:var(--ink2);padding:4px 2px;border-bottom:1px solid var(--line)}

/* column view */
.cols{display:flex;height:100%;overflow-x:auto;overflow-y:hidden}
.col{flex:none;width:214px;height:100%;overflow-y:auto;border-right:1px solid var(--line);padding:4px 0 84px}
.ci{display:flex;align-items:center;gap:6px;height:24px;margin:0 6px;padding:0 6px 0 8px;border-radius:6px;font:400 13px/1 var(--f)}
.ci .nm{flex:1}
.ci .ph-caret-right{font-size:11px;color:var(--ink3)}
.col:not(.act) .ci.sel{background:var(--soft2)!important;color:var(--ink)!important}
.col:not(.act) .ci.sel .ph-caret-right{color:var(--ink3)!important}
.pv{flex:1;min-width:290px;height:100%;overflow:auto;padding:28px 26px 90px;display:flex;flex-direction:column;align-items:center}

/* preview / info pane (columns + gallery) */
.inf{width:100%;max-width:330px;display:flex;flex-direction:column;gap:12px}
.inf .big{display:grid;place-items:center;padding:6px 0 4px}
.inf h2{font:600 15px/1.3 var(--f);text-align:center;word-break:break-word}
.inf .meta{font:400 12px/1.3 var(--f);color:var(--ink3);text-align:center;margin-top:-8px}
.inf h4{font:600 12px var(--f);color:var(--ink2);padding-top:8px;border-top:1px solid var(--line)}
.inf dl{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font:400 12px/1.35 var(--f)}
.inf dt{color:var(--ink3);text-align:right}
.inf dd{color:var(--ink);margin:0;word-break:break-word}
.tline{display:flex;gap:9px;align-items:flex-start;padding:10px 11px;border-radius:10px;background:var(--soft);font:400 12.5px/1.4 var(--f);color:var(--ink2)}
.tline img{width:18px;height:18px;flex:none;margin-top:1px}
.tline b{color:var(--ink);font-weight:600}
.tline .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.privbox{display:grid;place-items:center;gap:8px;text-align:center;color:var(--ink2);font:500 13px var(--f)}
.privbox .pl{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--lock);font:600 11.5px var(--f)}
.privbox .lkc{width:var(--s,96px);height:calc(var(--s,96px)*1.25);border-radius:10px;background:var(--soft);box-shadow:inset 0 0 0 1px var(--line);display:grid;place-items:center;color:var(--lock);font-size:calc(var(--s,96px)*.32)}

/* gallery */
.gal{display:grid;grid-template-columns:minmax(0,1fr) 290px;height:100%}
.gal .stage{display:grid;grid-template-rows:minmax(0,1fr) 92px;min-width:0;border-right:1px solid var(--line)}
.gal .big{display:grid;place-items:center;padding:20px;min-height:0;overflow:hidden}
.film{display:flex;gap:6px;align-items:center;overflow-x:auto;padding:0 16px;border-top:1px solid var(--line);justify-content:safe center}
.fs{flex:none;width:62px;height:62px;border-radius:8px;display:grid;place-items:center}
.fs.sel{background:var(--soft2)!important;box-shadow:inset 0 0 0 2px var(--ac)}
.gal .side2{overflow:auto;padding:22px 20px 90px}

/* empty + loading */
.empty{height:100%;display:grid;place-content:center;justify-items:center;gap:8px;text-align:center;padding:40px;padding-bottom:110px}
.empty .fi{opacity:.4;margin-bottom:6px}
.empty b{font:600 14px var(--f);color:var(--ink2)}
.empty p{font:400 12.5px/1.45 var(--f);color:var(--ink3);max-width:300px}
.skr{display:grid;grid-template-columns:var(--cols);align-items:center;height:var(--row);margin:0 8px;padding:0 12px}
.skr .skel{height:9px;margin:0 8px}
.skc{display:flex;flex-direction:column;align-items:center;gap:8px}

/* footer: path bar + status bar */
.foot{border-top:1px solid var(--line);background:var(--win);font:400 12px/1 var(--f);color:var(--ink2)}
.path{display:flex;align-items:center;gap:2px;height:26px;padding:0 12px;overflow:hidden;white-space:nowrap}
.path button{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 5px;border-radius:5px;color:var(--ink2)}
.path button:hover{background:var(--hov);color:var(--ink)}
.path .sepc{font-size:9px;color:var(--ink3)}
.path img{width:13px;height:13px}
.path span.last{display:inline-flex;align-items:center;gap:5px;padding:0 5px;color:var(--ink)}
.stat{height:24px;display:flex;align-items:center;justify-content:center;gap:6px;border-top:1px solid var(--line);color:var(--ink3);font-size:11.5px}
.stat .ph{font-size:12px;color:var(--ac-ink)}

/* Tuck in the corner */
.tuck{position:absolute;right:24px;bottom:66px;z-index:var(--z-tuck);width:46px;height:52px;padding:0;border-radius:14px}
.tuck img{position:absolute;left:-10px;top:-12px;width:66px;height:72px;display:block;pointer-events:none;transition:transform .3s var(--spring)}
.tuck:hover img{transform:translateY(-2px)}
.tuck.hop img{animation:hop .5s var(--spring)}
@keyframes hop{30%{transform:translateY(-8px) scale(1.06)}}
.tuck .count{position:absolute;top:-12px;left:-12px;box-shadow:0 0 0 2px var(--win)}
.bub{position:absolute;right:14px;bottom:140px;z-index:var(--z-tuck);width:280px;padding:12px 13px;border-radius:13px;background:var(--win);box-shadow:var(--sh-pop);font:400 13px/1.45 var(--f);color:var(--ink);opacity:0;transform:translateY(6px);pointer-events:none;transition:opacity .2s var(--ease),transform .2s var(--ease)}
.bub.on{opacity:1;transform:none;pointer-events:auto}
.bub::after{content:"";position:absolute;right:26px;bottom:-6px;width:12px;height:12px;background:var(--win);transform:rotate(45deg);box-shadow:2px 2px 0 0 var(--line)}
.bub .k{font:600 11px var(--f);color:var(--ink3);margin-bottom:3px;display:flex;align-items:center;gap:5px}
.bub .k img{width:13px;height:13px}
.bub .acts{display:flex;gap:6px;justify-content:flex-end;margin-top:10px}
.bub .field{margin-top:8px}
.bub .log{display:grid;gap:6px;max-height:220px;overflow:auto;margin-top:8px}
.bub .log:empty{display:none}
.bub .m{padding:7px 10px;border-radius:11px;font-size:12.5px;line-height:1.4;max-width:92%}
.bub .m.me{justify-self:end;background:var(--ac);color:#fff;border-bottom-right-radius:4px}
.bub .m.tk{justify-self:start;background:var(--soft);color:var(--ink);border-bottom-left-radius:4px}
.bub .m.tk b{font-weight:600}
.bub .acts a{text-decoration:none}
.bub .ans{margin-top:8px;padding:8px 10px;border-radius:9px;background:var(--soft);font-size:12.5px;color:var(--ink2)}
.bub ul{margin:6px 0 0;padding:0 0 0 2px;list-style:none;display:grid;gap:3px;font-size:12.5px;color:var(--ink2)}
.bub li{display:flex;align-items:center;gap:6px;min-width:0}.bub li .nm{flex:1;min-width:0}.bub li>:last-child{flex:none;white-space:nowrap}
.bub li .ph{color:var(--ink3);font-size:11px}

/* menus, hint, popover, quick look */
.menu{max-width:300px}
.menu .mh{display:flex;align-items:center;gap:6px;padding:6px 9px 3px;font:600 11px var(--f);color:var(--ink3)}
.menu .mh img{width:12px;height:12px}
.menu button .ph,.menu button .ph-fill{font-size:15px;width:16px;color:var(--ink2)}
.menu button:hover .ph,.menu button:hover .ph-fill,.menu button:focus-visible .ph{color:#fff}
.menu button:focus-visible{outline:0;background:var(--ac);color:#fff}
.menu button .k{margin-left:auto;color:var(--ink3);font-size:12px}
.menu button:hover .k{color:rgba(255,255,255,.85)}
.menu button[disabled]{opacity:.4;pointer-events:none}

/* the Really in column is for Tuck's folders; in Downloads seen through the switch every file is really in Downloads */

/* each view keeps its own order: real folders newest first (what just landed in Downloads is on top), Tuck's folders by name */
function syncSort(){if(S._sm!==S.mode){if(S._sm)S.sortBy[S._sm]=S.sort;S.sort=S.sortBy[S.mode];S._sm=S.mode}}

/* ---------- navigation */
function go(loc,o={}){

  if(loc.startsWith('s:'))S.mode='sorted';else if(S.mode==='sorted'&&isPlace(loc)){setPlace(loc.slice(2));loc='s:'}
  if(o.place)setPlace(o.place);

  if(!loc.startsWith('s:'))S.lastReal=loc;

  if(window.TuckChat&&N[loc])TuckChat.setup({context:loc==='s:'?placeName(S.place):(N[loc].crumb||N[loc].name)});
  hideHint();closePop();
  if(loc==='r:iCloud Drive'||loc==='v:network'){S.loading=true;setTimeout(()=>{S.loading=false;if(S.loc===loc)render()},900)}else S.loading=false;

function back(){if(!S.hist.length)return;S.fut.push(S.loc);go(S.hist.pop(),{push:false})}
function fwd(){if(!S.fut.length)return;S.hist.push(S.loc);go(S.fut.pop(),{push:false})}
function openItem(n){if(!n)return;if(isDir(n))go(n.id);else openQL()}
function setMode(m){

/* ---------- selection + keyboard */
function selectOnly(id){S.sel=new Set([id]);S.anchor=id}
function clickSelect(e,id){

function moveSel(delta,shift){

  if(shift&&S.anchor){const a=o.indexOf(S.anchor);S.sel=new Set(o.slice(Math.min(a,j),Math.max(a,j)+1));S.sel.delete(id);S.sel.add(id)}else selectOnly(id);

function afterSel(id){renderBody();renderFoot();renderBar();if(S.ql)renderQL();const e=body.querySelector(`[data-id="${CSS.escape(id)}"][data-nav]`)||body.querySelector(`[data-id="${CSS.escape(id)}"]`);e&&e.scrollIntoView({block:'nearest',inline:'nearest'})}

const curOne=()=>S.sel.size===1?N[[...S.sel][0]]:null;

document.addEventListener('keydown',e=>{
  const tg=e.target;if(tg.matches('input,textarea'))return;

  if(e.key==='Escape'){if(S.ql){closeQL();return}closeMenu();closePop();closeBub();hideHint();return}
  if(!$('#menu').hidden)return;
  const meta=e.metaKey||e.ctrlKey;

  if(meta&&e.key===']'){e.preventDefault();fwd();return}
  if(meta&&['1','2','3','4'].includes(e.key)){e.preventDefault();setView(['icons','list','columns','gallery'][+e.key-1]);return}
  if(meta&&e.key==='f'){e.preventDefault();$('#q').focus();return}
  if(meta&&e.key==='a'){e.preventDefault();S.sel=new Set(S.order);afterSel(S.order[0]);return}
  if(meta&&e.key==='ArrowUp'){e.preventDefault();const p=parentOf(S.loc);p&&go(p,{sel:S.loc});return}
  if(meta&&(e.key==='ArrowDown'||e.key==='o')){e.preventDefault();openItem(curOne());return}
  if(!body.contains(tg)&&tg!==document.body&&!tg.closest('.ql'))return;
  const one=curOne();

  if(e.key==='Enter'){e.preventDefault();one&&startRename(one.id);return}
  const v=S.view;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const d=e.key==='ArrowDown'?1:-1;moveSel(v==='icons'?d*perRow():d,e.shiftKey);return}
  if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();const r=e.key==='ArrowRight';
    if(v==='icons'||v==='gallery')return moveSel(r?1:-1,e.shiftKey);

      if(r&&one&&isDir(one)){const k=items(one.id);if(k.length){S.cols.push(one.id);selectOnly(k[0].id);afterSel(k[0].id)}}

/* ---------- rename */
function startRename(id){

  if(/clean|space|tidy/.test(l))return cleanLine()?`You can free <b>${cleanLine()}</b>. Everything goes to the Trash, so you can put it back. <a href="#" onclick="TuckChat.close();TuckLauncher.open('clean');return false">Show me</a>`:'Nothing to clean right now.';
  if(/need(s)? me|waiting|questions?/.test(l)){const n=tuckQ().left;return n?`${n} decision${n===1?'':'s'} need you, about ${Math.max(1,Math.round(n*.5))} minute${n>2?'s':''}. <a href="#" onclick="TuckChat.close();TuckLauncher.open('needs');return false">Answer them here</a>`:'All clear! Nothing needs you right now.'}
  if(/edit|my folders|organi[sz]e/.test(l)){const m=l.match(/organi[sz]e\s+(?:my\s+)?(.+?)(?:\s+folder)?$/);const name=m&&!/^(this|it|my|the)$/.test(m[1])?m[1]:'Downloads';
    return {html:`Here’s a plan for <b>${esc(name)}</b>: installers go to Installers, screenshots to Photos › Screenshots, class files to their class. Your own folders stay as they are.`,plan:{text:`Arrange ${name} in my folders.`,apply:()=>{},undo:()=>{}}}}
  return chatReply(q)}
/* the list keeps a lane free for Tuck only when its rows reach his corner (a short folder keeps its full width) */
function tuckGutter(){const L=body.querySelector('.lst'),t=$('#tuck');if(!L||!t)return;const sc=L.parentElement,rs=L.querySelector('.rows'),last=rs&&rs.lastElementChild;
  const tt=t.getBoundingClientRect().top-12;L.classList.toggle('tklane',sc.scrollHeight>sc.clientHeight+1||!!last&&last.getBoundingClientRect().bottom>tt)}
new MutationObserver(()=>tuckGutter()).observe(body,{childList:true});addEventListener('resize',tuckGutter);document.addEventListener('tuckchat',()=>setTimeout(tuckGutter,300));tuckGutter();
/* Tuck's notices lie over the path bar, beside him, so they never cover a file row (n4) */
TuckNotice.setPlace(N=>{const f=$('.foot'),t=TuckUI.anchorRect('#tuck');if(!f||!t)return false;const fr=f.getBoundingClientRect(),right=t.left-14,left=fr.left+12;if(right-left<320)return false;
  N.style.maxWidth=(right-left)+'px';N.style.maxHeight='';N.style.top='auto';const w=N.offsetWidth,h=N.offsetHeight;
  N.style.left=Math.max(left,right-w)+'px';N.style.bottom=(innerHeight-fr.bottom+Math.max(4,(fr.height-h)/2))+'px'});
TuckChat.setup({full:'tuck.html#chats',context:'Downloads',reply:finderReply,openFile:id=>{const f=PFILE[id];if(f&&f.real){TuckChat.close();reveal(f)}}});
/* the chat docks as a column in the window: the folder column steps aside while it is open */
document.addEventListener('tuckchat',e=>{$('#main').classList.toggle('chat',e.detail.open)});
/* the "N new" notice shows once per batch of new files in a session, then clears itself after 8 s (critique r2 #12) */
const newSeen=()=>{try{return sessionStorage.getItem('tuckNewSeen')===String(newFiles().length)}catch(e){return false}};
if(newFiles().length&&!newSeen())setTimeout(()=>{try{sessionStorage.setItem('tuckNewSeen',String(newFiles().length))}catch(e){}TuckNotice.show({text:`${newFiles().length} new in ${newWhere(newFiles())}. Want me to sort them?`,action:{label:'Show Me',fn:()=>TuckLauncher.open('sort')},dismiss:'Later'})},1600);
tuckDrag($('#tuck'),{img:TI,onLift:closeBub,setPose:p=>{tuckBusy=p!=='idle';TI.src=POSES[p]},wander:true});
document.addEventListener('tuckmood',e=>{const k=e.detail&&e.detail.mood;if(!k||!POSES[k]||tuckBusy&&!MOODY.has(TI.src))return;TI.src=POSES[k];tuckBusy=k!=='idle'});
const MOODY=new Set(['listen','think','happy','oops'].map(k=>POSES[k]));
function happy(ms=1600){tuckBusy=true;TI.src=POSES.happy;const t=$('#tuck');t.classList.remove('hop');void t.offsetWidth;t.classList.add('hop');setTimeout(()=>{TI.src=POSES.idle;tuckBusy=false},ms)}
/* the one sort state (Plan.sortNew): Today, History, Needs You, Brain and the launcher read the same row */
function applySort(nf,to){const ids=nf.map(f=>f.pf);if(TuckLauncher.steps.sortNow)return TuckLauncher.steps.sortNow(ids,to);
  const by={};nf.forEach(f=>{const to=PID[f.dest];if(to)(by[to]=by[to]||[]).push(f.pf)});
  return Plan.applyNow(Object.entries(by).map(([to,files])=>({ty:'moveFiles',files,to})),`Sorted ${nf.length} new file${nf.length===1?'':'s'}`)}
async function sortNew(quiet,ids,to){
  closeBub();const nf=newFiles().filter(f=>!ids||ids.includes(f.pf));if(!nf.length)return;
  const NL='s:No folder yet';if(S.mode!=='sorted'){S.mode='sorted';S.hist=[];S.fut=[];S.exp.clear();go(NL,{push:false});render({anim:true,navAnim:true})}
  else if(S.loc!==NL||S.view==='columns'&&S.cols.length>1)go(NL);
  await new Promise(r=>setTimeout(r,RM.matches?0:260));
  tuckBusy=true;TI.src=POSES.carry;
  const flights=nf.map((f,i)=>{const el=body.querySelector(`[data-id="${f.id}"]`);const top=f.dest.split('/')[0];
    const tg=body.querySelector(`[data-id="${CSS.escape('s:'+top)}"]`)||document.querySelector(`.sbi[data-loc="${CSS.escape('s:'+top)}"]`);
    if(!el||!tg||RM.matches)return Promise.resolve();
    /* a one-line chip (icon and name) flies, not the row: a row's columns would stack on top of each other outside the list (n1) */
    const nc=el.querySelector('.c.n')||el,r0=nc.getBoundingClientRect(),c=document.createElement('div');c.className='flier flychip';
    const ic=el.querySelector('.c.n .tw+*')||el.querySelector('img,.ph,svg');c.innerHTML=`${ic?ic.outerHTML:''}<span class="nm">${esc(f.name)}</span>`;
    Object.assign(c.style,{left:(r0.left+4)+'px',top:(r0.top+r0.height/2-11)+'px',maxWidth:Math.min(300,Math.max(160,r0.width))+'px'});document.body.appendChild(c);el.style.visibility='hidden';
    const a=c.getBoundingClientRect(),b=tg.getBoundingClientRect();
    const dx=b.left+b.width/2-(a.left+a.width/2),dy=b.top+b.height/2-(a.top+a.height/2);
    return c.animate([{transform:'none',opacity:1},{transform:`translate(${dx*.5}px,${dy*.5-30}px) scale(.7)`,opacity:1,offset:.55},{transform:`translate(${dx}px,${dy}px) scale(.25)`,opacity:0}],{duration:620,delay:i*150,easing:'cubic-bezier(.5,0,.3,1)',fill:'forwards'}).finished.then(()=>{c.remove();pulseEl(tg)})});
  await Promise.all(flights);
  const row=applySort(nf,to);if(!row)return null;happy();
  if(!quiet)toast(`Sorted ${nf.length} new files.`,()=>Plan.undoApply(row.id));return row;
}
function pulseEl(x){x.classList.remove('pulse');void x.offsetWidth;x.classList.add('pulse')}
function askTuck(f){TuckChat.open({context:f.name})}

/* ---------- right-hand column (Sorted view): the same right panel as Edit Folders and Tuck Brain (folderpanel.js).
   Every edit is a pending change in the one plan; the change bar below has Undo, Preview and Apply. */
const FSIDE=$('#fside');
const pretty=p=>p===''?'Desktop':p.split('/').join(' › ');
const filesIn=p=>FILES.filter(f=>f.t===p||(f.t&&f.t.startsWith(p+'/')));
const PH={toast:(m,u)=>toast(m,u),hide:()=>setSide(false),
  select:s=>{if(s&&s.type==='file'&&PFILE[s.id])openQL(PFILE[s.id].id)},
  ask:(text,s)=>{const v=Plan.view();const name=s&&s.type==='file'?(v.file(s.id)||{}).name:s&&s.type==='node'?(v.node(s.id)||{}).name:'';TuckChat.open({context:name||'Downloads'});TuckChat.send(text)},
  open:id=>{const f=PFILE[id];f&&toast(`Opening “${f.name}”. Opening files is not part of this prototype.`)},
  reveal:id=>reveal(PFILE[id]),
  quicklook:id=>{const f=PFILE[id];f&&openQL(f.id)},info:id=>{const f=PFILE[id];f&&openQL(f.id)},
  why:id=>{const f=PFILE[id];if(!f)return;S.why=f.id;openQL(f.id)}};
function panelSel(){if(S.mode!=='sorted'||S.view==='gallery'||S.loading)return null;const ns=selNodes();
  const as=n=>n.sorted&&n.pid?{type:'node',id:n.pid}:n.pf?{type:'file',id:n.pf}:null;
  if(ns.length>1){const items=ns.map(as).filter(Boolean);return items.length>1?{type:'multi',items}:items[0]||null}
  const one=ns[0];if(one&&one.sorted&&one.pid)return {type:'node',id:one.pid};
  if(one&&one.pf&&S.view!=='columns')return {type:'file',id:one.pf};
  const c=N[S.view==='columns'?S.cols[S.cols.length-1]:S.loc];return c&&c.pid?{type:'node',id:c.pid}:null}
/* everywhere else: Finder's own Preview pane (View › Show Preview, Shift-Command-P). It shows what you clicked, two or more
   as "N items", or the folder you are in when nothing is selected. Column and Gallery views have their own preview. */
function previewOf(){if(!S.pv||S.loading||S.view==='columns'||S.view==='gallery')return null;
  const ns=[...S.sel].map(id=>N[id]).filter(Boolean);if(ns.length>1)return {multi:ns};if(ns.length)return ns[0];
  return /^[rs]:/.test(S.loc)&&N[S.loc]?N[S.loc]:null}
function multiPane(ns){const sz=ns.reduce((a,n)=>a+(isDir(n)?0:n.size||0),0),nf=ns.filter(n=>!isDir(n)).length;
  return `<div class="inf"><div class="big stack">${ns.slice(0,3).map(n=>icon(n,96)).join('')}</div><h2>${ns.length} items</h2><div class="meta">${nf?fmtSize(sz):'Folders'}</div><h4>Information</h4><dl><dt>Selected</dt><dd>${ns.length} items</dd>${nf?`<dt>Size</dt><dd>${fmtSize(sz)}</dd>`:''}</dl></div>`}
function renderCard(){const sel=S.pv?panelSel():null,main=$('#main');
  if(!sel){const n=previewOf();if(!n){main.classList.remove('wc');FSIDE.innerHTML='';FSIDE._k='';return}
    const k='pv:'+(n.multi?n.multi.map(x=>x.id).join():n.id);if(FSIDE._k!==k){FSIDE._k=k;FSIDE.scrollTop=0}
    main.classList.add('wc');FSIDE.setAttribute('aria-label','Preview');FSIDE.onclick=null;FSIDE.innerHTML=`<div class="fp fpv"><div class="fp-tools"><button class="ib fp-hide" data-fphide aria-label="Hide the side panel" title="Hide the side panel (⇧⌘P)"><i class="ph ph-sidebar-simple"></i></button></div>${n.multi?multiPane(n.multi):infoPane(n,150)}</div>`;return}
  const k=JSON.stringify(sel);if(FSIDE._k!==k){FSIDE._k=k;FSIDE.scrollTop=0}
  main.classList.add('wc');FSIDE.setAttribute('aria-label','Selected Tuck folder');FolderPanel.render(FSIDE,sel,PH)}
/* the side column (Tuck's panel in Sorted view, Finder's Preview pane otherwise): its corner button hides it, the toolbar's
   sidebar button and Shift-Command-P bring it back. Remembered in localStorage 'finderSide'. */
function syncSideBtn(){const b=$('#sideBtn');if(!b)return;b.setAttribute('aria-pressed',S.pv);b.classList.toggle('on',S.pv);const l=S.pv?'Hide the side panel':'Show the side panel';b.setAttribute('aria-label',l);b.title=l+' (⇧⌘P)'}
function setSide(on){S.pv=!!on;try{localStorage.setItem('finderSide',on?'1':'0')}catch(e){}renderCard();syncSideBtn();if(!on){const b=$('#sideBtn');b&&b.focus()}}
$('#sideBtn').onclick=()=>setSide(!S.pv);syncSideBtn();
FSIDE.addEventListener('click',e=>{if(e.target.closest('[data-fphide]')&&!FSIDE.querySelector('.fp:not(.fpv)'))setSide(false)});
/* the change bar: what waits for Apply, the same list as Edit Folders' bottom bar */
function renderChg(){const el=$('#chg');const sm=Plan.summary();el.hidden=!sm.changes||S.mode!=='sorted';if(el.hidden)return;
  el.innerHTML=`<span class="cnum">${sm.changes}</span><a href="tuck.html#edit" title="See every change in Edit Folders">${esc(sm.line)}</a><button class="ib" id="chgUndo" title="Undo last change" aria-label="Undo last change"><i class="ph ph-arrow-counter-clockwise"></i></button><span class="sp"></span><span class="note">Nothing moves on disk.</span><button class="btn sm" id="chgPrev"><i class="ph ph-eye"></i>Preview</button><button class="btn sm pri" id="chgApply"><i class="ph ph-check"></i>Apply</button>`}
$('#chg').addEventListener('click',e=>{
  if(e.target.closest('#chgUndo')){const o=Plan.undo();o&&toast(`Undone: ${o.text}.`,()=>Plan.restore(o));return}
  if(e.target.closest('#chgPrev')){Resort.preview({});return}
  if(e.target.closest('#chgApply')){const row=Plan.apply();if(row){happy();toast('Applied. Nothing moved on disk.',()=>Plan.undoApply(row.id))}}});
Resort.config({toast:(m,u)=>toast(m,u)});
/* a change made here, on another page or in another tab: redraw from the plan */
Plan.subscribe(()=>{syncFromPlan();render()});

/* ---------- "Always put these here?" after 3 alike drags into the same Tuck folder */
const DRAGLOG={},RULES=[],ASKED=new Set();
const KINDP={pdf:'PDFs',doc:'Word documents',xls:'spreadsheets',txt:'text files',heic:'photos',png:'images',dmg:'installers'};
const likeKey=f=>/^Screenshot\b/i.test(f.name)?['shot','screenshots']:/^IMG_\d+/i.test(f.name)?['img','phone photos']:['k:'+f.type,KINDP[f.type]||'files like these'];
function learnDrag(ids,path){if(!path)return;const log=DRAGLOG[path]=DRAGLOG[path]||[];ids.forEach(id=>{if(!log.includes(id))log.push(id)});
  const c=new Map();log.forEach(id=>{const [k,l]=likeKey(N[id]);c.set(k,{l,n:((c.get(k)||{}).n||0)+1})});
  for(const [k,{l,n}] of c){const key=k+'>'+path;if(n>=3&&!ASKED.has(key)&&!RULES.some(r=>r.key===key)){ASKED.add(key);setTimeout(()=>askRule(key,l,path),RM.matches?0:450);return}}}
function askRule(key,label,path){happy(1200);
  openBub(`<div class="k"><img src="${MARK}" alt="">Tuck</div>You’ve put 3 ${esc(label)} here. <b>Always put ${esc(label)} in ${esc(pretty(path))}?</b><div class="acts"><button class="btn sm" id="rNo">Not now</button><button class="btn sm pri" id="rYes">Yes</button></div>`);
  $('#rNo').onclick=closeBub;
  /* the rule goes into the one plan (Plan.addRule), so Settings › Rules lists it on every page; Undo takes it out again */
  $('#rYes').onclick=()=>{const text=`${cap(label)} → ${pretty(path)}`;RULES.push({key,label,path,text});Plan.addRule&&Plan.addRule(text);closeBub();
    toast('Rule added. See it in Settings › Rules',()=>{const i=RULES.findIndex(r=>r.key===key);if(i>=0)RULES.splice(i,1);Plan.removeRule&&Plan.removeRule(text)})};$('#rYes').focus()}

/* ---------- toolbar wiring */
function setView(v){S.view=v;S.cols=[S.loc];if(v==='columns'){const one=curOne();if(one){S.sel=new Set([one.id])}}render();body.focus()}
$('#views').onclick=e=>{const b=e.target.closest('[data-v]');b&&setView(b.dataset.v)};
$('#back').onclick=back;$('#fwd').onclick=fwd;
$('#tsw').onclick=()=>setMode(S.mode==='sorted'?'real':'sorted');
$('#grpBtn').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();openMenu(sortItems(),r.left,r.bottom+6)};
$('#shareBtn').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();const ok=S.sel.size&&!selNodes().some(n=>n.priv);
  openMenu([{l:'AirDrop',ic:'broadcast',dis:!ok},{l:'Mail',ic:'envelope-simple',dis:!ok},{l:'Messages',ic:'chat-circle',dis:!ok},{l:'Notes',ic:'note',dis:!ok}].map(x=>({...x,fn:()=>toast('Sharing is not part of this prototype.')})),r.left,r.bottom+6)};
$('#tagBtn').onclick=()=>tagMenuAt();
$('#moreBtn').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();if(!S.sel.size){openMenu(bgMenu(),r.left,r.bottom+6);return}openMenu(itemMenu(),r.left-120,r.bottom+6)};
$('#q').addEventListener('input',e=>{S.q=e.target.value.trim();S.sel.clear();renderBody();renderBar();renderFoot()});
$('#q').addEventListener('keydown',e=>{if(e.key==='Escape'){e.target.value='';S.q='';render();body.focus()}if(e.key==='ArrowDown'){e.preventDefault();body.focus();moveSel(1)}});
$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-loc]');if(b){go(b.dataset.loc);}});
$('#path').addEventListener('click',e=>{const b=e.target.closest('[data-loc]');if(b)go(b.dataset.loc)});

/* ---------- theme */
function setTheme(t){document.documentElement.dataset.theme=t;$$('#theme button').forEach(b=>{b.classList.toggle('on',b.dataset.t===t);b.setAttribute('aria-pressed',b.dataset.t===t)})}
setTheme(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
$('#theme').onclick=e=>{const b=e.target.closest('[data-t]');b&&setTheme(b.dataset.t)};

addEventListener('keydown',e=>{if(e.key==='Tab')document.documentElement.classList.add('kb')});addEventListener('mousedown',()=>document.documentElement.classList.remove('kb'));
/* the switch is one setting for the whole Finder: it stays as you left it when you come back from Tuck or reload */
try{const pl=localStorage.getItem('tuckSortedPlace');if(PLACES.includes(pl))setPlace(pl);else setPlace(PLACES[0]);if(localStorage.getItem('tuckSorted')==='1'){S.loc=S.lastReal='r:'+S.place;setMode('sorted')}}catch(e){setPlace(PLACES[0])}
render();body.focus();
