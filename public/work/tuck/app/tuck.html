<style>
.acclist{display:grid;gap:2px;margin-top:12px;max-height:280px;overflow:auto}.acclist label{display:flex;gap:10px;align-items:flex-start;padding:6px 8px;border-radius:8px;cursor:pointer}.acclist label:hover{background:var(--hov)}.acclist input{margin-top:3px;accent-color:var(--ac)}.acclist b{display:block;font:600 13px/1.35 var(--f);color:var(--ink)}.acclist small{display:block;font:500 12px/1.35 var(--f);color:var(--ink3)}
a.btn{text-decoration:none}
/* ---------- outside the window */
.appsw{display:flex;margin:10px 12px 8px;position:static}.appsw button{flex:1;justify-content:center}/* Finder | Tuck: inside the window, top of the sidebar, full width */
.nav{margin-top:12px}
.themesw{position:fixed;top:2px;right:32px;z-index:5;transform:scale(.88);transform-origin:top right}

/* ---------- sidebar */
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side .seg{margin:14px 12px 6px;display:flex}
.side .seg button{flex:1}
.nav{flex:1;overflow:auto;padding:4px 10px 10px}
.nav h6{font:600 11.5px/1 var(--f);color:var(--ink3);padding:16px 10px 6px}
.row{display:flex;align-items:center;gap:9px;width:100%;height:30px;padding:0 8px 0 10px;border-radius:8px;color:var(--ink);font:500 13.5px/1 var(--f);text-decoration:none;text-align:left}
.row:hover{background:var(--hov)}
.row .ph,.row .ph-fill{font-size:17px;color:var(--ac-ink);width:18px;text-align:center}
.row span.l{flex:1}
.row.on{background:var(--sel);color:var(--sel-ink)}
.row.on .ph-fill{color:var(--sel-ink)}
.row .ext{font-size:13px;color:var(--ink3)}
.prof{display:flex;align-items:center;gap:10px;padding:10px 10px 12px 14px;border-top:1px solid var(--line)}
.ava{width:30px;height:30px;border-radius:50%;background:var(--ac-fill2);color:var(--ac-ink);display:grid;place-items:center;font:700 12px var(--f);flex:none}
.prof .t{flex:1;min-width:0;line-height:1.25}
.prof b{font:600 13px var(--f);display:block}
.prof small{font:500 12px var(--f);color:var(--ink3)}

/* ---------- main */
.main{display:grid;grid-template-rows:52px minmax(0,1fr);grid-template-columns:minmax(0,1fr);min-width:0;min-height:0;position:relative}
.tb{display:flex;align-items:center;gap:10px;padding:0 14px 0 22px;background:var(--bar);border-bottom:1px solid var(--line)}
.tb h1{font:650 15.5px/1 var(--f);flex:1}
.tb .search{min-width:220px}
.body{overflow:auto;position:relative;min-height:0}
.page{padding:28px 36px 96px;max-width:1120px}
/* wide windows (rule 29): every page sits in the middle of the window at its max width, never hugging the left */
.page,.needs,.nhead{margin-inline:auto}
.enter{animation:enter .25s var(--ease) both}
@keyframes enter{from{opacity:0;transform:translateY(6px)}}

.prof .ib.on{background:var(--sel);color:var(--sel-ink)}

.empty{display:grid;place-items:center;text-align:center;padding:56px 20px;gap:6px}

.empty b{font:650 18px var(--f)}
.empty p{color:var(--ink2);max-width:360px}
.empty .btn{margin-top:12px}

/* ---------- file thumbnails */
.th{width:78px;flex:none;text-align:center}
.th .pg{position:relative;height:92px;border-radius:8px;background:var(--win);box-shadow:0 0 0 1px var(--line2),0 2px 6px -3px rgba(20,30,60,.25);display:grid;place-items:center;overflow:hidden}

/* ---------- Today */

.tgrid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(300px,1fr);gap:36px;align-items:start}
/* when the side chat docks and the page narrows, Today's two columns stack instead of squeezing */
.main{container-type:inline-size}
@container (max-width:760px){.tgrid{grid-template-columns:minmax(0,1fr)}}
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:2px;background:var(--line);border-radius:2px}

/* ---------- Needs You */
.needs{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;padding:18px 36px 96px;max-width:1160px;align-items:start}
.dcard{border-radius:16px;background:var(--win);box-shadow:0 0 0 1px var(--line),0 18px 40px -26px rgba(20,30,60,.35);padding:28px 30px 26px;min-height:470px;display:flex;flex-direction:column}
.dcard.in{animation:cin .32s var(--ease) both}

@keyframes cin{from{opacity:0;transform:translateY(18px) scale(.985)}}
@keyframes cout{to{opacity:0;transform:translateX(60px) rotate(1.5deg)}}

.dcard h2{font:700 27px/1.2 var(--f);letter-spacing:-.015em;max-width:560px}

.dacts{display:flex;align-items:center;gap:10px;margin-top:auto;padding-top:24px}

.dacts{flex-wrap:wrap}
.nyfiles{display:grid;gap:2px;margin:12px 0 4px;padding:8px 10px;border-radius:10px;background:var(--fill,rgba(127,127,127,.07))}.nyfiles>small{margin-bottom:4px}.nyf{display:grid;grid-template-columns:18px minmax(0,1fr) auto;align-items:center;gap:8px;padding:4px 0}.nyf b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nyf small{color:var(--ink3,var(--muted));font-variant-numeric:tabular-nums}.nyfiles .lnk{padding:4px 0 0 26px;color:var(--ac-ink);text-decoration:none;font-weight:500}.nyfiles .lnk:hover{text-decoration:underline}
.nhead{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:12px 22px;align-items:center;padding:22px 36px 0;max-width:1160px}.nhead .nprog{grid-column:1/-1;grid-row:2}.np{flex:0 1 auto}
.nht h2{font:700 24px/1.15 var(--f);letter-spacing:-.015em}.nht p{margin-top:3px;font:500 12.5px var(--f);color:var(--ink2);max-width:300px}
.nprog{display:flex;gap:6px;min-width:0}
.np{flex:1;min-width:0;display:flex;align-items:center;gap:6px;height:40px;padding:0 10px;border-radius:11px;background:var(--soft);font:600 12px var(--f);color:var(--ink3);transition:background .2s var(--ease),color .2s var(--ease);position:relative;overflow:hidden}
.np span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.np .ph,.np .ph-fill{font-size:16px;flex:none}
.np.cur{background:var(--ac);color:#fff;box-shadow:0 6px 16px -8px var(--ac)}.np.done{background:var(--ok-fill);color:var(--ok)}.np.no{background:var(--soft2);color:var(--ink2)}
.np:not(.cur):hover{background:var(--hov);color:var(--ink)}
.npct{display:grid;gap:5px}.npct small{font:500 11.5px var(--f);color:var(--ink3)}
.pbar{display:block;height:6px;border-radius:3px;background:var(--soft2);overflow:hidden}.pbar i{display:block;height:100%;background:var(--ok);border-radius:3px;transition:width .4s var(--ease)}
.dcard .top .pos{margin-left:0}
.conf{margin-left:auto;display:inline-flex;align-items:center;gap:7px;font:600 12px var(--f);color:var(--ok)}.conf .cbar{width:56px;height:5px;border-radius:3px;background:var(--soft2);overflow:hidden}.conf .cbar i{display:block;height:100%;background:currentColor}
.conf.low{color:var(--warn)}
.dsec{margin-top:18px}.dsec h4{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font:600 12.5px var(--f);color:var(--ink2);margin-bottom:8px}.dsec h4 small{font:500 12px var(--f);color:var(--ink3)}
.sigs{list-style:none;padding:0;margin:0;display:grid;gap:6px}.sigs li{display:flex;gap:9px;align-items:flex-start;font:500 14px/1.45 var(--f);color:var(--ink)}.sigs .ph{font-size:17px;color:var(--ac-ink);margin-top:1px;flex:none}
.chg{display:grid;grid-template-columns:minmax(0,.8fr) auto minmax(0,1.7fr);gap:12px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--soft)}
.chg small{display:flex;gap:8px;align-items:baseline;font:600 11px var(--f);color:var(--ink3);margin-bottom:4px}.chg .dhint{font-weight:500;width:auto;color:var(--ink3)}
.chg .crumb{font-size:13.5px;flex-wrap:wrap}.carr{color:var(--ink3);font-size:18px}
.dcard .dest{display:block;padding:0;border:0}
.cfacts{margin-top:8px;font:500 12.5px var(--f);color:var(--ink2)}.cfacts b{color:var(--ink)}
.dsec .files{margin:0 0 14px}.dsec .tray{margin:0}
.ifno{display:flex;gap:8px;align-items:flex-start;margin-top:16px;padding:10px 12px;border-radius:10px;background:var(--soft);font:500 13px/1.45 var(--f);color:var(--ink2)}.ifno .ph{margin-top:2px;color:var(--ink3)}.ifno b{color:var(--ink)}
/* only the action row sticks to the bottom while the card scrolls; the composer is the card's last line, under it */
.dcard .dacts{position:sticky;bottom:0;z-index:2;display:block;margin:16px -30px 0;padding:14px 30px 14px;background:var(--win);box-shadow:0 -1px 0 var(--line)}
.dcard .ncomp{margin-top:4px}
.np b{margin-left:auto;font:700 11px var(--f);padding:1px 6px;border-radius:999px;background:rgba(0,0,0,.08)}.np.cur b{background:rgba(255,255,255,.25)}
.conf.sure{color:var(--ok)}.conf.leaning{color:var(--ac-ink)}.conf.unsure{color:var(--warn)}
.dacts .arow{display:flex;gap:8px;flex-wrap:nowrap}.dacts .arow .btn{white-space:nowrap}.dacts .note{display:block;margin:8px 0 0;font:500 12px var(--f);color:var(--ink3)}
.qbanner,.qerr{display:flex;align-items:center;gap:10px;margin:0 0 14px;padding:10px 12px;border-radius:11px;font:500 13px/1.4 var(--f)}.qbanner span,.qerr span{flex:1}
.qbanner{background:var(--ok-fill);color:var(--ink)}.qbanner .ph-fill{color:var(--ok);font-size:18px}
.qerr{background:var(--danger-fill)}.qerr>.ph{color:var(--danger);font-size:18px}
.ncomp{margin-top:16px}
.qi.st-done,.qi.st-no,.qi.st-skipped{opacity:.7}.qi.st-done>.ph-fill{color:var(--ok)}.qi.st-skipped>.ph-fill{color:var(--warn)}
.qdone{max-width:560px;margin:48px auto;text-align:center;display:grid;gap:10px;justify-items:center}.qdone img{width:96px}.qdone h3{font:700 22px var(--f)}.qdone p{color:var(--ink2)}.qdone .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.qlook[hidden]{display:none}.qlook{position:fixed;z-index:var(--z-pop);width:200px;padding:10px;border-radius:12px;background:var(--win);box-shadow:var(--sh-pop);display:grid;gap:4px;pointer-events:none;animation:dcin .18s var(--ease) both}.qlook .sheet-pv{width:100%;height:220px}.qlook>b{font:600 12.5px var(--f);word-break:break-word}.qlook small{font:500 11.5px var(--f);color:var(--ink3)}
.upd{list-style:none;padding:0;margin:6px 0 0;display:grid;gap:10px}.upd li{display:flex;gap:9px;align-items:flex-start;font:500 12.5px/1.45 var(--f);color:var(--ink)}.upd li>.ph,.upd li>.ph-fill{font-size:16px;color:var(--ac-ink);margin-top:1px;flex:none}
.upd li small{display:block;color:var(--ink3);font-size:11.5px}.upd .ph-fill.ph-check-circle{color:var(--ok)}
@media (max-width:1000px){.nhead{grid-template-columns:1fr}}

   shortens its labels and drops the key hints, so it stays one line inside the card */
.nhead{container-type:inline-size}.nprog .np{flex:none}.np span{overflow:visible}
@container (max-width:900px){.nprog{flex-wrap:wrap}.np{padding:0 10px;gap:6px}}/* labels always show: an icon alone doesn't say what it filters */
.dcard{container-type:inline-size}.dacts .arow .btn .short,.dacts .note .narrow{display:none}
@container (max-width:500px){.dacts .arow .btn .kbd,.dacts .note .wide{display:none}.dacts .note .narrow{display:inline}.dacts .arow .btn.lg{padding-inline:14px}.dacts .arow{gap:6px}}
@media (max-width:1240px){.needs{grid-template-columns:minmax(0,1fr) 240px;gap:20px;padding:16px 28px 96px}.nhead{padding:18px 28px 0}}
@media (max-height:780px){.dcard{padding-top:22px}.dcard h2{font-size:23px}.dcard .top{margin-bottom:12px}.dsec{margin-top:14px}}
.th .mo{position:absolute;left:6px;top:6px;z-index:1;padding:1px 5px;border-radius:5px;background:var(--win);box-shadow:0 0 0 1px var(--line);font:600 10px var(--f);color:var(--ink2)}
.th.added .pg{box-shadow:0 0 0 2px var(--ok)}.th.added .mo{color:var(--ok)}
.th[draggable=true]{cursor:grab}.th.dragging{opacity:.4}
.files{border-radius:12px;transition:background .15s var(--ease),box-shadow .15s var(--ease)}
.want-in .files{outline:2px dashed var(--ac);outline-offset:4px;background:var(--ac-fill)}.files.over{background:var(--ac-fill2)}
.tray{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:-8px 0 16px;padding:8px 10px;border-radius:12px;border:1.5px dashed var(--line2);transition:background .15s var(--ease),border-color .15s var(--ease)}
.tray .trl{display:flex;align-items:center;gap:6px;font:500 12px var(--f);color:var(--ink3)}
.tray .th.mini{width:56px}.tray .th.mini .pg{height:64px}.tray .th.mini .pg .ph{font-size:22px}
.want-out .tray{border-color:var(--danger);background:var(--danger-fill)}.tray.over{background:var(--danger-fill)}
.flyer{position:fixed;z-index:75;pointer-events:none;margin:0}
.crumb .pulse,.crumb.pulse{animation:cpulse .5s var(--ease)}@keyframes cpulse{40%{transform:scale(1.12);color:var(--ac-ink)}}
.dacts .note{white-space:nowrap}
.th{position:relative}

.th:hover .x,.th .x:focus-visible{opacity:1;transform:none}
.th .x .ph{font-size:12px}

.crumb .seg:hover{background:var(--hov)}.crumb .seg:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.crumb input.seg-in{font:600 14px var(--f);color:var(--ink);background:var(--win);border:0;border-radius:5px;padding:2px 6px;box-shadow:0 0 0 2px var(--ac);width:160px}
.dest > span:first-child{flex:none}

/* Diary, Stack view (from prototype 36): every photo as one long stack of cards receding into the screen, newest in front.

.dvsw{margin-left:12px}

/* ---------- Settings */
/* Settings is a hub: a section rail on the left, one section on the right; at 1680 the pair sits in the middle (rule 29).
   Only the theme's accent, ink and greys here: no green (owner, 1 Nov), so --ok, --lock and part hues are not used in Settings. */
.page.prefs{max-width:1060px;display:grid;grid-template-columns:184px minmax(0,1fr);gap:30px;align-items:start}
.srail{position:sticky;top:0;min-width:0}

.ssearch input{flex:1;min-width:0;border:0;background:none;outline:0;font:500 13px var(--f);color:var(--ink)}
.srail h6{font:600 11px/1 var(--f);color:var(--ink3);padding:16px 10px 6px;margin:0}
.srail hr{border:0;border-top:1px solid var(--line);margin:12px 6px}
.srail [role=tab]{display:flex;align-items:center;gap:9px;width:100%;height:30px;padding:0 10px;border-radius:8px;font:500 13.5px/1 var(--f);color:var(--ink);text-align:left}

.srail [role=tab]:hover{background:var(--hov)}
.srail [role=tab][aria-selected=true]{background:var(--sel);color:var(--sel-ink)}.srail [role=tab][aria-selected=true] .ph-fill{color:var(--sel-ink)}
.spane{min-width:0;container:spane/inline-size}
.phead{margin-bottom:22px}.phead h2{font:650 21px/1.2 var(--f);letter-spacing:-.01em}
.phead p{color:var(--ink2);font:500 13.5px/1.5 var(--f);margin-top:6px;max-width:620px}
.pmeta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:12px}.pmeta .aff{margin-top:0}
.stage{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:7px;background:var(--ac-fill);color:var(--ac-ink);font:600 12px/1 var(--f);text-decoration:none}
.stage:hover{background:var(--ac-fill2)}
/* where a setting takes effect */

.srow.glance{align-items:flex-start}.srow.glance .btn{flex:none}
.srow.flash{animation:sflash 1.6s var(--ease)}@keyframes sflash{0%,40%{background:var(--ac-fill2)}}
.sres .shit{width:100%;text-align:left}.sres .shit:hover{background:var(--hov)}.sres .go{color:var(--ink3);font-size:15px}

/* a narrow pane (1100 px window, or the chat docked): wide controls sit under their text */
@container spane (max-width:620px){.srow.wide{flex-wrap:wrap}.srow.wide>.stx{flex:1 1 calc(100% - 50px)}.srow.wide>.seg,.srow.wide>input[type=range]{margin-left:36px}.srow .dsel span{display:none}}

.hchip:hover{box-shadow:inset 0 0 0 1px var(--ac)}

.htrace .srow{align-items:flex-start;padding:10px 16px}.htrace .stx small{order:-1;margin-bottom:2px;text-transform:uppercase;letter-spacing:.05em;font-size:10.5px;font-weight:600}.htrace .stx{display:flex;flex-direction:column}.htrace .stx b{font-weight:500}

.srow.off b{color:var(--ink3)}
.srow.lim{cursor:pointer}.srow.lim input{width:18px;height:18px;accent-color:var(--ac)}.srow.lim.on{background:color-mix(in srgb,var(--ac) 6%,transparent)}
.srow input[type=range]{width:180px;accent-color:var(--ac)}

/* ---------- sheet */
.sheet{position:absolute;inset:0;z-index:var(--z-sheet);display:grid;place-items:center;background:rgba(15,20,40,.26);animation:fade .18s var(--ease)}

/* ---------- Tuck */
/* his corner is the sidebar's empty bottom, above the profile row: he never sits on page content (rule 7) */
#tuck{position:absolute;left:calc(var(--side-w,232px) - 80px);bottom:62px;width:64px;height:70px;z-index:var(--z-tuck);cursor:grab;touch-action:none;transition:transform .18s var(--ease)}
#tuck img{width:100%;height:100%;pointer-events:none;user-select:none;-webkit-user-drag:none}
#tuck.drag{cursor:grabbing;transition:none}
#tuck.hidden{display:none}
#tuck:focus-visible{outline-offset:0;border-radius:12px}
.tbub{position:absolute;right:0;bottom:76px;width:max-content;max-width:196px;white-space:normal;padding:8px 12px;border-radius:12px 12px 4px 12px;background:var(--win);box-shadow:var(--sh-pop);font:600 13px var(--f);color:var(--ink);opacity:0;transform:translateY(4px);transition:opacity .2s var(--ease),transform .2s var(--ease);pointer-events:none}
.tbub.on{opacity:1;transform:none}
#tuck.left .tbub{right:auto;left:0;border-radius:12px 12px 12px 4px}

/* ---------- Folder Workbench (Edit Folders): top bar, view (Tree / Columns / Graph), right panel, change bar */
body:has(.wb) .tb .search{display:none}
.wb{position:relative;height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);min-height:0;min-width:0}
.wb-bar{display:flex;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--win);min-width:0}
.wb-bar .sp{flex:1;min-width:0}.wb-bar .btn{flex:none}
.wb-find{position:relative;flex:0 1 240px;min-width:150px}.wb-find .search{min-width:0;width:100%}
.wb-hits{position:absolute;left:0;top:calc(100% + 6px);z-index:var(--z-pop);width:340px;max-height:360px;overflow:auto;padding:4px;border-radius:12px;background:var(--win);box-shadow:var(--sh-pop)}
.wb-hits button{display:flex;align-items:center;gap:8px;width:100%;min-height:40px;padding:4px 8px;border-radius:8px;text-align:left}
.wb-hits button span{min-width:0}.wb-hits b{display:block;font:500 13px var(--f);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.wb-hits small{display:block;font:500 12px var(--f);color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wb-hits button:hover,.wb-hits button.kb{background:var(--sel)}.wb-hits .ph-fill{font-size:16px;flex:none}.wb-nohit{padding:12px;font:500 13px var(--f);color:var(--ink3)}
.wb-main{display:grid;grid-template-columns:minmax(0,1fr) 320px;min-height:0}
.wb-view{min-width:0;min-height:0;overflow:auto;position:relative}
.wb-panel{border-left:1px solid var(--line);overflow:auto;min-height:0;background:var(--win)}
.wb-panel .fp-cmp{padding-bottom:32px}
.wb-main.noside{grid-template-columns:minmax(0,1fr)}.wb-main.noside>.wb-panel{display:none}.wb-bar [data-wbside] .ph{transform:scaleX(-1)}
.wb-cbar{display:flex;align-items:center;gap:8px;min-height:56px;min-width:0;padding:8px 16px 8px 16px;border-top:1px solid var(--line);background:var(--bar)}.wb-cbar>.btn,.wb-cbar>.ib{flex:none}
.wb-cbar .sp{flex:1}.wb-note{font:500 12px var(--f);color:var(--ink3)}
.wb-calm{display:inline-flex;align-items:center;gap:8px;font:500 13px var(--f);color:var(--ink2)}.wb-calm .ph{color:var(--ok);font-size:16px}
.wb-chg{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 8px 0 4px;border-radius:9px;font:500 13px var(--f);color:var(--ink)}.wb-chg:hover{background:var(--hov)}
.wb-chg .cnum{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 6px;border-radius:7px;background:var(--ac);color:#fff;font:700 12px var(--f)}.wb-chg .ph{color:var(--ink3);font-size:12px}
.wb-list{position:absolute;left:16px;bottom:64px;z-index:var(--z-pop);width:400px;max-height:50vh;overflow:auto;padding:8px;border-radius:14px;background:var(--win);box-shadow:var(--sh-pop);animation:dcin .2s var(--ease) both}
.wb-list .dc .g{font:500 13px/1.35 var(--f)}.wb-list .dc .g small{font-size:12px}
.wb-ask{position:absolute;left:16px;bottom:64px;z-index:var(--z-pop);display:flex;align-items:center;gap:8px;padding:8px 8px 8px 12px;border-radius:12px;background:var(--ink);color:var(--win);font:500 13px var(--f);box-shadow:var(--sh-pop);animation:dcin .2s var(--ease) both;max-width:calc(100% - 360px)}
.wb-ask[hidden]{display:none}.wb-ask span{flex:1;min-width:0}.wb-ask .btn{background:rgba(255,255,255,.14);color:inherit;box-shadow:none}.wb-ask .btn.ghost{background:transparent}
.wb-flyer{position:fixed;z-index:75;pointer-events:none;margin:0;background:var(--win);border-radius:8px;box-shadow:var(--sh-pop)}
/* tree */
.wt{padding:8px 8px 32px}
.wt-row{--h:var(--k-folder);display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 12px 0 calc(8px + var(--d)*20px);border-radius:8px;position:relative;font:500 13px var(--f);color:var(--ink);user-select:none;text-align:left;outline-offset:-2px}
.wt-row.top{height:40px;margin-top:2px}.wt-row.top .wt-nm{font-weight:600}
.wt-row:hover{background:var(--hov)}.wt-row.sel{background:var(--sel)}.wt-row.sel .wt-nm{color:var(--sel-ink)}
.wt-row .sp{flex:1;min-width:8px}
.wt-car{width:16px;height:16px;display:grid;place-items:center;color:var(--ink3);font-size:11px;flex:none;border-radius:4px}.wt-car:hover{background:var(--soft2)}
.wt-life{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:var(--h);color:#fff;font-size:14px;flex:none;box-shadow:inset 0 -1.5px 0 rgba(0,0,0,.14)}
.wt-row.special .wt-life{background:var(--soft2);color:var(--ink2);box-shadow:none}
.wt-fic{font-size:17px;color:var(--h);flex:none}
.wt-nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:2px 4px;margin-left:-4px;border-radius:4px}
.wt-nm input{font:600 13px var(--f);height:24px;width:220px;padding:0 6px}
.wt-row.sug{box-shadow:inset 0 0 0 1.5px transparent}.wt-row.sug::before{content:"";position:absolute;inset:3px 4px 3px calc(28px + var(--d)*20px);border:1.5px dashed color-mix(in srgb,var(--h) 55%,transparent);border-radius:7px;pointer-events:none}
.wt-row.sug .wt-nm{color:var(--ink2)}.wt-sugq{font:500 12px var(--f);color:var(--ink3);white-space:nowrap}
.wt-yn{position:relative;z-index:1;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:13px;background:var(--win);box-shadow:0 0 0 1px var(--line2);flex:none}
.wt-yn.yes{color:var(--ok)}.wt-yn.yes:hover{background:var(--ok);color:#fff;box-shadow:none}.wt-yn.no{color:var(--ink2)}.wt-yn.no:hover{background:var(--soft2);color:var(--ink)}
.wt-yn.sm{width:20px;height:20px;font-size:11px;opacity:0}.wt-row:hover .wt-yn.sm,.wt-yn.sm:focus-visible{opacity:1}
.wt-meta{font:500 12px var(--f);color:var(--ink3);font-variant-numeric:tabular-nums;white-space:nowrap}.wt-cnt{min-width:28px;text-align:right}
.wt-kinds{display:flex;gap:2px;color:var(--ink3);font-size:13px}
.wt-row.file{height:28px}.wt-row.file .wt-nm{color:var(--ink2)}.wt-row.file.sel .wt-nm{color:var(--sel-ink)}
.wt-row.more{height:28px;color:var(--ac-ink);font:600 12px var(--f)}.wt-row.more:hover{background:transparent;text-decoration:underline}
.wt-row.hid>*:not(.tag){opacity:.5}
.wt-row.root{height:28px;color:var(--ink3);font:600 12px var(--f);gap:8px}.wt-row.root small{font:500 12px var(--f);color:var(--ink3)}.wt-row.root .ph{font-size:15px}
.wt-lk{color:var(--lock);font-size:12px;flex:none}
.wt-row .tag{height:18px;padding:0 6px}
.wt-row.drop{background:color-mix(in srgb,var(--h) 16%,transparent);box-shadow:inset 0 0 0 1.5px var(--h);margin-bottom:28px;transition:margin .18s var(--ease)}
.wt-row.drop.flat{margin-bottom:0}
.wt-row.grown{animation:dcin .2s var(--ease) both}
.wb-ghost{position:fixed;left:0;top:0;z-index:80;display:none;align-items:center;gap:8px;max-width:280px;height:30px;padding:0 10px;border-radius:8px;background:var(--win);box-shadow:var(--sh-pop),0 0 0 1px var(--line2);font:500 13px var(--f);color:var(--ink);pointer-events:none;opacity:.96}
.wb-ghost.on{display:flex}.wb-ghost span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.wb-ghost b{flex:none;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--ac);color:#fff;font:700 11px/20px var(--f);text-align:center}
.wb-cbar .wb-ask{position:static;max-width:none;box-shadow:none;animation:none;display:flex;align-items:center;gap:8px;flex:1 1 auto;min-width:0;margin-left:8px;padding:4px 4px 4px 10px;border-radius:10px;background:var(--ac-fill);font:500 13px var(--f);color:var(--ink)}
.wb-cbar .wb-ask>.ph{color:var(--ac-ink);flex:none}.wb-cbar .wb-ask>span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.wb-cbar .wb-ask .btn{flex:none}
.wb-calm.undone .ph{color:var(--ac-ink)}
.wb-cbar .wb-chg{flex:0 1 auto;min-width:0;white-space:nowrap}.wb-cbar .wb-chg>span:not(.cnum){min-width:0;overflow:hidden;text-overflow:ellipsis}.wb-cbar .wb-chg>.cnum,.wb-cbar .wb-chg>.ph{flex:none}
/* the "Always put…" question takes its own line above the buttons when the bar is not wide enough for both (rule 8) */
@container (max-width:1240px){.wb-cbar:has(.wb-ask){flex-wrap:wrap;row-gap:8px}.wb-cbar .wb-ask{order:-1;flex:1 1 100%;margin-left:0}.wb-cbar:has(.wb-ask) [data-wbundo]{margin-right:auto}}
.wb-cbar .wb-ask .btn{background:var(--win);color:var(--ink);box-shadow:0 0 0 1px var(--line2)}.wb-cbar .wb-ask .btn.ghost{background:transparent;box-shadow:none}
.wt-row.root.drop{--h:var(--ac)}
.wt-row.dragging{opacity:.4}
.wt-row.landed{animation:wtland .9s var(--ease) both}@keyframes wtland{0%{background:color-mix(in srgb,var(--h,var(--ac)) 28%,transparent)}100%{background:transparent}}
.wt-row.file.landed{--h:var(--ok)}
/* columns (Finder) */
.wc{display:flex;height:100%;overflow-x:auto;overflow-y:hidden;background:var(--win)}
.wc-col{flex:none;width:224px;border-right:1px solid var(--line);overflow-y:auto;padding:4px 6px}
.wc-row{display:flex;align-items:center;gap:6px;height:24px;padding:0 6px;border-radius:5px;font:500 13px var(--f);color:var(--ink);white-space:nowrap}
.wc-row>span:not(.fpth):not(.tag){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}.wc-row .ph-fill{font-size:15px;flex:none}.wc-row .ph-caret-right{font-size:10px;color:var(--ink3);flex:none}
.wc-row:hover{background:var(--hov)}.wc-row.path{background:var(--soft2)}.wc-row.cur{background:var(--ac);color:#fff}.wc-row.cur .ph-fill,.wc-row.cur .ph{color:#fff!important}
.wc-row.sug{color:var(--ink2)}.wc-row .tag{height:16px;font-size:11px}.wc-row.drop{box-shadow:inset 0 0 0 1.5px var(--ac);background:var(--ac-fill)}.wc-row.dragging{opacity:.4}
.wc-pv{flex:none;width:240px;padding:24px 16px;display:grid;justify-items:center;align-content:start;gap:8px;text-align:center;font:500 13px var(--f)}.wc-pv small{color:var(--ink3);font-size:12px}.wc-pv b{font-weight:600;word-break:break-word}
/* graph (Brain look, read-only) */
.wg{position:relative;height:100%;min-height:360px;background:radial-gradient(ellipse at 50% 45%,var(--win) 0%,var(--soft) 100%);overflow:hidden}
:root[data-theme="dark"] .wg{background:radial-gradient(ellipse at 50% 45%,#1d2646 0%,#111729 55%,#0a0e1a 100%)}
.wg svg{display:block}
.wg-n{transition:transform .55s var(--ease);cursor:pointer;outline:none}.wg-n:focus-visible circle:last-of-type{stroke:var(--ac-ink);stroke-width:2}
.wg-n:hover .wg-l{fill:var(--ink)}.wg-n.on .wg-l{fill:var(--ink);font-weight:650}
.wg-l{fill:var(--ink2);font:500 12px var(--f);pointer-events:none;transition:opacity .2s var(--ease)}.wg-l.l3{opacity:0}.wg-n:hover .wg-l.l3,.wg-n.on .wg-l.l3,.wg-n:focus-visible .wg-l.l3{opacity:1}.wg-l.dim{opacity:0}.wg-n:hover .wg-l.dim{opacity:1}.wg-l.a{font-weight:650;fill:var(--ink)}
.wg-c{fill:var(--win);stroke:var(--line2)}:root[data-theme="dark"] .wg-c{fill:rgba(255,255,255,.08);stroke:rgba(255,255,255,.35)}
.wg-e{stroke-opacity:.35;stroke-width:1.2}.wg-edges.fade{animation:wgf .7s var(--ease) both}@keyframes wgf{0%,40%{opacity:0}}
.wg-legend{position:absolute;left:16px;bottom:12px;display:flex;gap:16px;font:500 12px var(--f);color:var(--ink2)}.wg-legend span{display:inline-flex;align-items:center;gap:6px}
.wg-legend .lg{width:10px;height:10px;border-radius:50%;display:inline-block}.wg-legend .lg.solid{background:#7d9bff}.wg-legend .lg.dash{border:1.5px dashed #7d9bff}.wg-legend .lg.new{border:1.5px solid #4cc873}.wg-legend .lg.ring{border:2px solid #8fb0ff}
@media (prefers-reduced-motion:reduce){.wt-row.landed,.wg-edges.fade{animation:none}.wg-n,.wt-row.drop{transition:none}}
@media (max-width:1180px){.wb-bar .seg button{padding:0 8px}}
/* short windows: the panel's composer keeps its field but not its chips, so the privacy choice above it shows whole */
@media (max-height:780px){.wb-panel .tkc-chips{display:none}}
/* narrow (rule 8): the view switch and the Show menu keep their icons; their names stay in the tooltip */
@media (max-width:1240px){.wb-bar .seg button,.wb-bar [data-wbopento]{font-size:0;gap:0;padding:0 9px}.wb-bar .seg button .ph,.wb-bar [data-wbopento] .ph{font-size:16px}}

/* ---------- Needs You, two panes (design: .tuck-proto/design-needs-you). Type colours: never green. */
